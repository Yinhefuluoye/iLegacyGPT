name: build-ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Theos
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: theos-${{ runner.os }}-sdk10.3-v2

      - name: Prepare Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: ${{ github.workspace }}/theos
          theos-src: 'https://github.com/theos/theos'
          theos-sdks: 'https://github.com/theos/sdks'
          theos-sdks-branch: 'master'

      - name: Patch SDK stubs for armv7 executables
        run: |
          python3 tools/patch_sdk.py --sdk "$THEOS/sdks/iPhoneOS10.3.sdk"

      - name: Build app
        run: |
          set -o pipefail
          cd ios
          make FINALPACKAGE=1 2>&1 | tail -n 160

      - name: Locate app bundle
        run: |
          set -e
          APP="$(find ios/.theos/obj -type d -name 'ChatAI.app' | head -n 1)"
          echo "APP=$APP"
          test -n "$APP"
          test -d "$APP"
          ls -la "$APP" | head -n 40
          file "$APP/ChatAI" || true
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Package IPA
        run: |
          set -e
          python3 tools/package_ipa.py \
            --app "$APP_PATH" \
            --out dist \
            --version "0.1.${{ github.run_number }}" \
            --bundle-version "${{ github.run_number }}"
          unzip -l dist/*.ipa | head -n 20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatAI-ipa-${{ github.run_number }}
          path: dist/*.ipa
          if-no-files-found: error
