<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f6f6f2">
<title>AI 对话</title>
<style>
/* ==THEME-TOKENS-START== */
/* =========================================================
   Direction D · 白底浅色（C 的浅色版；静态分层，不用实时模糊）
   ========================================================= */
:root {
  --bg: #f6f6f2;
  --bg-image:
    radial-gradient(circle at 50% -10%, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0) 55%),
    linear-gradient(180deg, #fbfbf8 0%, #f3f3ee 58%, #ededE7 100%);
  --fg: #1b1d1a;
  --fg-dim: rgba(27, 29, 26, 0.62);
  --fg-faint: rgba(27, 29, 26, 0.38);
  --topbar-border: rgba(0, 0, 0, 0.07);
  --icon-hover-bg: rgba(0, 0, 0, 0.05);
  --surface: #ffffff;
  --surface-border: rgba(0, 0, 0, 0.08);
  --surface-shadow: 0 1px 0 rgba(255, 255, 255, 0.85) inset, 0 14px 34px rgba(23, 24, 20, 0.10);
  --composer-focus-border: rgba(160, 120, 60, 0.55);
  --input-fg: #1b1d1a;
  --placeholder: #9a9f98;
  --surface-icon: #5b605a;
  --surface-hover: rgba(0, 0, 0, 0.05);
  --surface-dim: #7b807a;
  --chip-bg: #f0f0ea;
  --chip-border: rgba(0, 0, 0, 0.06);
  --chip-fg: #33362f;
  --chip-hover: #e8e8e1;
  --accent: #b98a4b;
  --accent-fg: #ffffff;
  --think-on-bg: rgba(185, 138, 75, 0.14);
  --think-on-border: rgba(185, 138, 75, 0.45);
  --think-on-fg: #8a5f28;
  --send-bg: #22241f;
  --send-fg: #f7f7f3;
  --send-border: rgba(34, 36, 31, 0.9);
  --send-off-bg: rgba(0, 0, 0, 0.06);
  --send-off-fg: rgba(0, 0, 0, 0.28);
  --user-bubble-bg: #e9e9e1;
  --user-bubble-fg: #1e201c;
  --bubble-radius: 18px;
  --bubble-tail-radius: 8px;
  --ai-fg: rgba(24, 26, 22, 0.9);
  --ai-strong: #111310;
  --code-bg: rgba(0, 0, 0, 0.05);
  --code-fg: #7a5a2e;
  --divider: rgba(0, 0, 0, 0.08);
  --overlay: rgba(24, 24, 20, 0.32);
  --sheet-bg: #ffffff;
  --sheet-border: rgba(0, 0, 0, 0.08);
  --sheet-shadow: 0 34px 90px rgba(23, 24, 20, 0.18);
  --field-bg: #f4f4ef;
  --field-border: rgba(0, 0, 0, 0.09);
  --field-fg: #1b1d1a;
  --label: rgba(27, 29, 26, 0.55);
  --selected-bg: rgba(185, 138, 75, 0.10);
  --selected-border: rgba(185, 138, 75, 0.5);
  --danger: #b0403c;
  --toast-bg: #26282b;
  --toast-fg: #f5f5f1;
  --greeting-size: 38px;
  --greeting-weight: 500;
  --greeting-tracking: 0;
  --greeting-shadow: 0 10px 44px rgba(0, 0, 0, 0.06);
  --msg-size: 16px;
  --radius-sheet: 20px;
}
@media (min-width: 900px) {
  :root { --greeting-size: 45px; }
}
/* ==THEME-TOKENS-END== */

/* =========================================================
   Base · 布局与通用组件（三个方向共用）
   ========================================================= */
* { box-sizing: border-box; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  color: var(--fg);
  background-color: var(--bg);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}
button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
button {
  margin: 0; padding: 0; border: 0; background: none;
  -webkit-appearance: none; appearance: none;
  cursor: pointer;
}
input, textarea, select {
  -webkit-appearance: none; appearance: none;
  border-radius: 0; outline: none;
}
svg { display: block; }

/* 整页 App 容器：固定满屏，避免 iPad 上 body 滚动 */
.app {
  position: fixed;
  top: 0; right: 0; bottom: 0; left: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background-color: var(--bg);
  background-image: var(--bg-image);
  background-repeat: no-repeat;
  background-position: center;
  background-size: cover;
}

/* ---------- 顶栏 ---------- */
.topbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 58px;
  padding: 0 28px;
  border-bottom: 1px solid var(--topbar-border);
  position: relative;
  z-index: 5;
}
.wordmark {
  font-size: 13px;
  letter-spacing: 2px;
  color: var(--fg-faint);
}
.topbar-actions { display: flex; align-items: center; }
.ghost-btn {
  display: none;
  height: 34px;
  padding: 0 13px;
  margin-right: 4px;
  border-radius: 999px;
  font-size: 13px;
  color: var(--fg-dim);
}
.app.chat .ghost-btn { display: block; }
.ghost-btn:hover { background: var(--icon-hover-bg); }
.icon-btn {
  width: 40px; height: 40px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--fg-dim);
}
.icon-btn:hover { background: var(--icon-hover-bg); color: var(--fg); }
.icon-btn svg { width: 21px; height: 21px; }

/* ---------- 主舞台 ---------- */
.stage {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}

/* 首屏：大标题 + 胶囊 */
.hero {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0 32px 44px;
  text-align: center;
}
.app.chat .hero { display: none; }
.greeting {
  margin: 0 0 34px;
  max-width: 880px;
  font-size: var(--greeting-size);
  font-weight: var(--greeting-weight);
  letter-spacing: var(--greeting-tracking);
  line-height: 1.28;
  color: var(--fg);
  text-shadow: var(--greeting-shadow);
}
.hero-composer { width: 100%; max-width: 680px; text-align: left; }
.hero-note {
  margin: 15px 0 0;
  font-size: 12px;
  letter-spacing: 0.3px;
  color: var(--fg-faint);
}

/* 对话流 */
.thread {
  display: none;
  flex: 1 1 auto;
  min-height: 0;
  overflow-x: hidden;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 10px 32px 26px;
}
.app.chat .thread { display: block; }
.thread-inner { width: 100%; max-width: 720px; margin: 0 auto; }
.thread::-webkit-scrollbar { width: 0; height: 0; }

/* 底部输入区 */
.dock {
  display: none;
  flex: 0 0 auto;
  padding: 8px 32px 20px;
  position: relative;
  z-index: 6;
}
.app.chat .dock { display: block; }
.dock-inner { max-width: 720px; margin: 0 auto; }

/* ---------- 输入胶囊 ---------- */
.composer {
  display: flex;
  flex-direction: column;
  width: 100%;
  padding: 8px;
  border: 1px solid var(--surface-border);
  border-radius: 999px;
  background: var(--surface);
  box-shadow: var(--surface-shadow);
  -webkit-transition: border-color 0.16s ease, box-shadow 0.16s ease;
  transition: border-color 0.16s ease, box-shadow 0.16s ease;
}
.composer.is-stacked { border-radius: 30px; }
.composer.is-focused { border-color: var(--composer-focus-border); }
.composer-row {
  display: flex;
  align-items: center;
  min-height: 46px;
}

/* 附件预览 */
.attach-row {
  display: none;
  align-items: center;
  padding: 4px 6px 6px 6px;
}
.composer.has-attach .attach-row { display: flex; }
.attach-thumb {
  display: block;
  width: 46px; height: 46px;
  border-radius: 12px;
  object-fit: cover;
  background: rgba(0, 0, 0, 0.06);
}
.attach-name {
  margin-left: 10px;
  max-width: 240px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 12px;
  color: var(--surface-dim);
}
.attach-remove {
  margin-left: auto;
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; line-height: 1;
  color: var(--surface-dim);
}
.attach-remove:hover { background: var(--surface-hover); }

/* 左侧加号 */
.plus-btn {
  flex: 0 0 auto;
  width: 40px; height: 40px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--surface-icon);
}
.plus-btn:hover { background: var(--surface-hover); }
.plus-btn svg { width: 20px; height: 20px; }

/* 输入区 */
.composer-input {
  flex: 1 1 auto;
  min-width: 0;
  width: 100%;
  height: 44px;
  min-height: 44px;
  max-height: 132px;
  padding: 10px 8px;
  border: 0;
  background: transparent;
  resize: none;
  overflow-y: auto;
  font-size: 17px;
  line-height: 24px;
  color: var(--input-fg);
  -webkit-user-select: text;
  user-select: text;
}
.composer-input::-webkit-input-placeholder { color: var(--placeholder); }
.composer-input::placeholder { color: var(--placeholder); }

/* 右侧工具 */
.composer-tools {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  padding-left: 2px;
}
.chip {
  display: flex;
  align-items: center;
  height: 34px;
  padding: 0 12px;
  margin-right: 6px;
  border: 1px solid var(--chip-border);
  border-radius: 999px;
  background: var(--chip-bg);
  color: var(--chip-fg);
  font-size: 13px;
  white-space: nowrap;
  -webkit-transition: background 0.14s ease, border-color 0.14s ease, color 0.14s ease;
  transition: background 0.14s ease, border-color 0.14s ease, color 0.14s ease;
}
.chip:hover { background: var(--chip-hover); }
.chip-caret {
  display: inline-block;
  width: 0;
  height: 0;
  margin-left: 6px;
  border-left: 3.5px solid transparent;
  border-right: 3.5px solid transparent;
  border-top: 4px solid currentColor;
  opacity: 0.55;
  font-size: 0;
}
.model-chip-name {
  max-width: 132px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.think-dot {
  width: 7px; height: 7px;
  margin-right: 6px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.4;
}
.think-chip.is-on {
  background: var(--think-on-bg);
  border-color: var(--think-on-border);
  color: var(--think-on-fg);
}
.think-chip.is-on .think-dot { opacity: 1; background: var(--accent); }
.send-btn {
  flex: 0 0 auto;
  width: 44px; height: 44px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--send-border);
  background: var(--send-bg);
  color: var(--send-fg);
  -webkit-transition: background 0.16s ease, opacity 0.16s ease;
  transition: background 0.16s ease, opacity 0.16s ease;
}
.send-btn:active { -webkit-transform: scale(0.94); transform: scale(0.94); }
.send-btn[disabled] {
  background: var(--send-off-bg);
  color: var(--send-off-fg);
  border-color: transparent;
  cursor: default;
}
.send-btn svg { width: 20px; height: 20px; }

/* ---------- 消息 ---------- */
.msg { margin: 0 0 28px; }
.msg:last-child { margin-bottom: 4px; }
.msg.user { display: flex; flex-direction: column; align-items: flex-end; }
.bubble {
  max-width: 76%;
  padding: 13px 18px;
  border-radius: var(--bubble-radius);
  border-bottom-right-radius: var(--bubble-tail-radius);
  background: var(--user-bubble-bg);
  color: var(--user-bubble-fg);
  font-size: var(--msg-size);
  line-height: 1.62;
  white-space: pre-wrap;
  word-wrap: break-word;
  overflow-wrap: break-word;
  -webkit-user-select: text;
  user-select: text;
}
.bubble-img {
  display: block;
  max-width: 220px;
  max-height: 180px;
  margin-bottom: 10px;
  border-radius: 14px;
}
.msg.ai { padding-right: 4%; }
.ai-body {
  font-size: var(--msg-size);
  line-height: 1.78;
  color: var(--ai-fg);
  -webkit-user-select: text;
  user-select: text;
}
.ai-body p { margin: 0 0 13px; }
.ai-body p:last-child { margin-bottom: 0; }
.ai-body strong { color: var(--ai-strong); font-weight: 600; }
.ai-body ul { margin: 0 0 13px; padding-left: 21px; }
.ai-body ol { margin: 0 0 13px; padding-left: 22px; }
.ai-body ul:last-child, .ai-body ol:last-child { margin-bottom: 0; }
.ai-body li { margin: 0 0 7px; }
.ai-body li:last-child { margin-bottom: 0; }
.ai-body code {
  font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace;
  font-size: 0.86em;
  padding: 2px 6px;
  border-radius: 6px;
  background: var(--code-bg);
  color: var(--code-fg);
}

/* 思考中 */
.thinking-body {
  display: flex;
  align-items: center;
  color: var(--fg-dim);
  font-size: 14px;
  letter-spacing: 0.2px;
}
.thinking-dots { display: flex; align-items: center; margin-right: 9px; }
.thinking-dots i {
  display: block;
  width: 6px; height: 6px;
  margin-right: 5px;
  border-radius: 50%;
  background: var(--fg-dim);
  -webkit-animation: tdPulse 1.2s infinite ease-in-out;
  animation: tdPulse 1.2s infinite ease-in-out;
}
.thinking-dots i:nth-child(2) { -webkit-animation-delay: 0.15s; animation-delay: 0.15s; }
.thinking-dots i:nth-child(3) { -webkit-animation-delay: 0.3s; animation-delay: 0.3s; }
@-webkit-keyframes tdPulse {
  0%, 100% { opacity: 0.25; -webkit-transform: translateY(0); }
  40% { opacity: 1; -webkit-transform: translateY(-2px); }
}
@keyframes tdPulse {
  0%, 100% { opacity: 0.25; transform: translateY(0); }
  40% { opacity: 1; transform: translateY(-2px); }
}
.stream-caret {
  display: inline-block;
  width: 2px; height: 1.05em;
  margin-left: 1px;
  vertical-align: -0.16em;
  background: var(--fg-dim);
  -webkit-animation: caretBlink 1s steps(1) infinite;
  animation: caretBlink 1s steps(1) infinite;
}
@-webkit-keyframes caretBlink {
  0%, 55% { opacity: 1; }
  56%, 100% { opacity: 0; }
}
@keyframes caretBlink {
  0%, 55% { opacity: 1; }
  56%, 100% { opacity: 0; }
}

/* ---------- 弹层 ---------- */
.overlay {
  position: fixed;
  top: 0; right: 0; bottom: 0; left: 0;
  z-index: 40;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: var(--overlay);
}
.overlay.is-open { display: flex; }
.sheet {
  width: 520px;
  max-width: 100%;
  max-height: 88%;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--sheet-bg);
  border: 1px solid var(--sheet-border);
  border-radius: var(--radius-sheet);
  box-shadow: var(--sheet-shadow);
  -webkit-animation: sheetIn 0.2s ease-out both;
  animation: sheetIn 0.2s ease-out both;
}
.sheet::-webkit-scrollbar { width: 0; height: 0; }
.sheet.is-model { width: 460px; }
@-webkit-keyframes sheetIn {
  from { opacity: 0; -webkit-transform: translateY(12px); }
  to { opacity: 1; -webkit-transform: translateY(0); }
}
@keyframes sheetIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.sheet-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 22px 14px;
}
.sheet-head h2 {
  margin: 0;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 0.2px;
  color: var(--fg);
}
.sheet-close {
  width: 32px; height: 32px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  line-height: 1;
  color: var(--fg-dim);
}
.sheet-close:hover { background: var(--icon-hover-bg); color: var(--fg); }
.sheet-body { padding: 0 22px 22px; }
.sheet-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 22px 18px;
  border-top: 1px solid var(--divider);
}
.foot-note { font-size: 12px; color: var(--fg-faint); }

/* 模型弹层 */
.model-list { padding: 0 10px 8px; }
.model-item {
  display: flex;
  align-items: center;
  width: 100%;
  padding: 13px 14px;
  border: 1px solid transparent;
  border-radius: 14px;
  text-align: left;
  color: var(--fg);
}
.model-item + .model-item { margin-top: 4px; }
.model-item:hover { background: var(--field-bg); }
.model-item.is-selected {
  background: var(--selected-bg);
  border-color: var(--selected-border);
}
.model-name { font-size: 15px; letter-spacing: 0.1px; }
.model-desc {
  margin-left: auto;
  margin-right: 12px;
  font-size: 12px;
  color: var(--fg-faint);
}
.model-check {
  width: 18px;
  font-size: 14px;
  color: var(--accent);
  opacity: 0;
  text-align: center;
}
.model-item.is-selected .model-check { opacity: 1; }

/* 设置弹层 */
.field { margin-bottom: 16px; }
.field-label {
  display: block;
  margin-bottom: 7px;
  font-size: 12px;
  letter-spacing: 0.4px;
  color: var(--label);
}
.field-input {
  width: 100%;
  height: 42px;
  padding: 0 13px;
  border: 1px solid var(--field-border);
  border-radius: 12px;
  background: var(--field-bg);
  color: var(--field-fg);
  font-size: 14px;
}
.field-input:focus { border-color: var(--accent); }
.field-input::-webkit-input-placeholder { color: var(--fg-faint); }
.field-input::placeholder { color: var(--fg-faint); }
.field-row { display: flex; margin-bottom: 16px; }
.field-row .field { margin-bottom: 0; }
.field-grow { flex: 1 1 auto; margin-right: 12px; }
.field-port { width: 96px; flex: 0 0 auto; }
.select-shell { position: relative; }
.select-shell select {
  width: 100%;
  height: 42px;
  padding: 0 36px 0 13px;
  border: 1px solid var(--field-border);
  border-radius: 12px;
  background: var(--field-bg);
  color: var(--field-fg);
  font-size: 14px;
}
.select-shell select:focus { border-color: var(--accent); }
.select-caret {
  position: absolute;
  right: 15px;
  top: 50%;
  margin-top: -2.5px;
  width: 0;
  height: 0;
  border-left: 4px solid transparent;
  border-right: 4px solid transparent;
  border-top: 5px solid var(--fg-faint);
  pointer-events: none;
}
.size-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}
.size-row .field-label { margin-bottom: 0; }
.size-control { display: flex; align-items: center; }
.size-btn {
  width: 44px; height: 34px;
  border: 1px solid var(--field-border);
  border-radius: 10px;
  background: var(--field-bg);
  color: var(--field-fg);
  font-size: 14px;
  display: flex; align-items: center; justify-content: center;
}
.size-btn:hover { background: var(--icon-hover-bg); }
.size-value {
  min-width: 48px;
  text-align: center;
  font-size: 14px;
  color: var(--fg);
}
.wide-btn {
  display: block;
  width: 100%;
  height: 46px;
  margin-bottom: 10px;
  border: 1px solid var(--field-border);
  border-radius: 13px;
  background: var(--field-bg);
  color: var(--field-fg);
  font-size: 14.5px;
}
.wide-btn:hover { background: var(--icon-hover-bg); }
.wide-btn.is-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-fg);
}
.wide-btn.is-danger {
  color: var(--danger);
  border-color: rgba(176, 64, 60, 0.35);
  background: rgba(176, 64, 60, 0.06);
}
.sheet-divider {
  height: 1px;
  margin: 8px 0 14px;
  background: var(--divider);
}
.sheet-note {
  margin: 2px 0 0;
  text-align: center;
  font-size: 11.5px;
  letter-spacing: 0.2px;
  color: var(--fg-faint);
}

/* Toast */
.toast {
  position: fixed;
  left: 50%;
  bottom: 112px;
  z-index: 60;
  padding: 10px 18px;
  border-radius: 999px;
  background: var(--toast-bg);
  color: var(--toast-fg);
  font-size: 13px;
  white-space: nowrap;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.16);
  opacity: 0;
  -webkit-transform: translate(-50%, 8px);
  transform: translate(-50%, 8px);
  -webkit-transition: opacity 0.2s ease, -webkit-transform 0.2s ease;
  transition: opacity 0.2s ease, transform 0.2s ease;
  pointer-events: none;
}

      this.applyConfig();
      const note = document.querySelector("#settingsOverlay .sheet-note");
      if (note) {
        note.textContent = "\u914D\u7F6E\u4EC5\u4FDD\u5B58\u5728\u672C\u673A";
      }
      this.openOverlay($("settingsOverlay"));
    }
    setBuildInfo(build) {
      const foot = document.querySelector("#settingsOverlay .sheet-foot .foot-note");
      if (foot) {
        foot.textContent = "\u7248\u672C " + build + " \xB7 \u914D\u7F6E\u4EC5\u4FDD\u5B58\u5728\u672C\u673A";
      }
    }
    toast(text) {
      this.toastEl.textContent = text;
      this.toastEl.classList.add("is-visible");
      if (this.toastTimer) {
        window.clearTimeout(this.toastTimer);
      }
      this.toastTimer = window.setTimeout(() => {
        this.toastEl.classList.remove("is-visible");
      }, 1600);
    }
  };

  // src/main.ts
  function boot() {
    const bridge = new Bridge();
    const app = new App(bridge);
    window.__app = app;
    app.init().catch(function(err) {
      const box = document.createElement("pre");
      box.style.cssText = "position:fixed;left:12px;right:12px;bottom:12px;z-index:999;margin:0;padding:10px 12px;border-radius:10px;background:#fff;color:#b3261e;font-size:12px;line-height:1.5;white-space:pre-wrap;box-shadow:0 10px 30px rgba(0,0,0,.18)";
      box.textContent = "UI init failed: " + (err && err.message ? err.message : String(err));
      document.body.appendChild(box);
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot, false);
  } else {
    boot();
  }
})();

</script>
</body>
</html>
