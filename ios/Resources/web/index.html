<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ChatAI</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: rgba(0,0,0,0); }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background:
      radial-gradient(120% 90% at 50% 0%, #16204a 0%, #0a1026 55%, #050814 100%);
    color: #eef1ff;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    -webkit-user-select: none; user-select: none;
  }
  .wrap { text-align: center; padding: 24px; }
  h1 { font-size: 44px; font-weight: 500; letter-spacing: .5px; margin: 0 0 10px; }
  .sub { font-size: 17px; color: rgba(238,241,255,.62); margin: 0 0 28px; }
  .pill {
    display: flex; align-items: center;
    width: min(680px, 86vw); height: 58px;
    padding: 0 8px 0 18px; border-radius: 29px;
    background: rgba(255,255,255,.10);
    border: 1px solid rgba(255,255,255,.16);
  }
  .pill .dot { width: 8px; height: 8px; border-radius: 4px; background: #6ea8ff; margin-right: 12px;
    box-shadow: 0 0 12px rgba(110,168,255,.9); }
  .pill .txt { font-size: 17px; color: rgba(238,241,255,.55); flex: 1; text-align: left; }
  .pill .send { width: 42px; height: 42px; border-radius: 21px; background: #eef1ff; color: #0a1026;
    font-size: 18px; line-height: 42px; text-align: center; font-weight: 600; }
  #status { margin-top: 26px; font-size: 13px; color: rgba(238,241,255,.45); word-break: break-all; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>AI 对话</h1>
    <p class="sub">Hello from WKWebView</p>
    <div class="pill">
      <span class="dot"></span>
      <span class="txt">问问任何问题…</span>
      <span class="send">↑</span>
    </div>
    <p id="status">bridge: waiting…</p>
  </div>
<script>
  window.__onNative = function (msg) {
    var el = document.getElementById('status');
    if (el) el.textContent = 'bridge: ' + JSON.stringify(msg);
  };
  try {
    window.webkit.messageHandlers.chat.postMessage({ op: 'hello', from: 'webview' });
  } catch (e) {
    document.getElementById('status').textContent = 'bridge error: ' + e.message;
  }
</script>
</body>
</html>
